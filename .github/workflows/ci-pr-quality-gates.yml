name: "CI — Pull Request Quality Gates"

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# ── Concurrency ───────────────────────────────────────────────────────────────
# Cancel any in-progress run for the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Default permissions (least-privilege) ────────────────────────────────────
permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.11"

# ═══════════════════════════════════════════════════════════════════════════════
jobs:

  # ── Job 1: Repository structure validation ───────────────────────────────
  validate-repository:
    name: "1 · Validate Repository Structure"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          required_files=(
            "README.md"
            "Dockerfile"
            "pyproject.toml"
            "requirements.txt"
            "Makefile"
            ".gitignore"
            ".env.example"
            "src/serve/app.py"
            "src/evaluate/metrics.py"
            "pipelines/retrain.py"
          )
          missing=()
          for f in "${required_files[@]}"; do
            if [[ ! -f "$f" ]]; then
              missing+=("$f")
              echo "  ❌ MISSING: $f"
            else
              echo "  ✅ $f"
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo ""
            echo "ERROR: ${#missing[@]} required file(s) are missing."
            exit 1
          fi
          echo ""
          echo "All required files present ✅"

      - name: Check no secrets or credentials committed
        run: |
          echo "Scanning for accidental credential files..."
          forbidden_patterns=(
            "*.json"               # service account keys
            "dbt/profiles.yml"     # dbt BigQuery credentials
            "*.pem"
            "*.key"
          )
          found_issues=false
          for pattern in "${forbidden_patterns[@]}"; do
            # Exclude schema files and known-safe JSON
            matches=$(git ls-files "$pattern" 2>/dev/null | grep -v "pyproject.toml" || true)
            if [[ -n "$matches" ]]; then
              echo "  ⚠️  Potentially sensitive file tracked: $matches"
              found_issues=true
            fi
          done
          if [[ "$found_issues" == "true" ]]; then
            echo "WARNING: Potentially sensitive files are tracked in Git."
            echo "Please review and add to .gitignore if needed."
            # Do not fail here — profiles.yml.example is intentional
          else
            echo "No credential files detected ✅"
          fi

      - name: Verify .env is gitignored
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "❌ ERROR: .env file is tracked in Git — remove it immediately!"
            exit 1
          else
            echo "✅ .env is not tracked in Git"
          fi

  # ── Job 2: Python linting with Ruff ──────────────────────────────────────
  lint:
    name: "2 · Ruff Lint"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff==0.4.9

      - name: Run Ruff linter
        run: |
          echo "Running Ruff linter..."
          ruff check src tests pipelines --output-format=github
        # --output-format=github annotates the PR diff directly

  # ── Job 3: Python formatting check ───────────────────────────────────────
  format-check:
    name: "3 · Ruff Format Check"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install ruff==0.4.9

      - name: Check formatting
        run: |
          echo "Checking code formatting..."
          ruff format --check src tests pipelines
          echo "Formatting check passed ✅"

  # ── Job 4: Unit tests with pytest ────────────────────────────────────────
  unit-tests:
    name: "4 · Unit Tests (pytest)"
    runs-on: ubuntu-latest
    needs: [lint, format-check]   # Only run if lint and format pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v \
            --tb=short \
            --junitxml=reports/junit-unit.xml \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()   # Upload even on failure so we can inspect
        with:
          name: unit-test-results
          path: reports/
          retention-days: 14

      - name: Write test summary
        if: always()
        run: |
          echo "## Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ -f reports/junit-unit.xml ]]; then
            python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('reports/junit-unit.xml')
          root = tree.getroot()
          suite = root if root.tag == 'testsuite' else root.find('testsuite')
          tests = suite.get('tests', '?')
          failures = suite.get('failures', '0')
          errors = suite.get('errors', '0')
          skipped = suite.get('skipped', '0')
          print(f'| Metric | Count |')
          print(f'|--------|-------|')
          print(f'| Total | {tests} |')
          print(f'| Failures | {failures} |')
          print(f'| Errors | {errors} |')
          print(f'| Skipped | {skipped} |')
          " >> $GITHUB_STEP_SUMMARY
          fi

  # ── Job 5: API smoke test ─────────────────────────────────────────────────
  api-smoke-test:
    name: "5 · API Smoke Test"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API smoke tests
        run: |
          echo "Running API smoke tests via TestClient (no live server needed)..."
          pytest tests/smoke/ -v --tb=short -m smoke

  # ── Job 6: Docker build validation ───────────────────────────────────────
  docker-build:
    name: "6 · Docker Build"
    runs-on: ubuntu-latest
    needs: [validate-repository]   # Structure must be valid before building
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: shopsignal-api:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Inject build metadata
          build-args: |
            APP_VERSION=pr-${{ github.event.pull_request.number }}-${{ github.sha }}

      - name: Verify image starts and /health responds
        run: |
          echo "Starting container for health check..."
          docker run --rm -d \
            --name shopsignal-test \
            -p 8080:8080 \
            -e APP_ENV=test \
            shopsignal-api:pr-${{ github.event.pull_request.number }}

          echo "Waiting for service to be ready..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "✅ Health check passed on attempt $i"
              break
            fi
            echo "  Attempt $i/15 — waiting..."
            sleep 2
          done

          HEALTH=$(curl -s http://localhost:8080/health)
          echo "Health response: $HEALTH"

          docker stop shopsignal-test

          if ! echo "$HEALTH" | grep -q '"status":"ok"'; then
            echo "❌ Health check returned unexpected response"
            exit 1
          fi
          echo "✅ Docker image verified successfully"

      - name: Write Docker build summary
        run: |
          echo "## Docker Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image tag | \`shopsignal-api:pr-${{ github.event.pull_request.number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health check | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          echo "| Note | Image built but NOT pushed to any registry |" >> $GITHUB_STEP_SUMMARY
